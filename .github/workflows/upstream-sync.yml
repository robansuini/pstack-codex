name: Upstream sync

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'robansuini/pstack-codex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check unattended GitHub identity
        env:
          GH_TOKEN: ${{ secrets.PSTACK_SYNC_TOKEN }}
        run: python3 scripts/publish-upstream-pr.py --check-auth
      - name: Prepare upstream changes without credentials
        run: python3 scripts/sync-upstream.py
      - name: Publish draft PR as robansuini
        env:
          GH_TOKEN: ${{ secrets.PSTACK_SYNC_TOKEN }}
        run: python3 scripts/publish-upstream-pr.py
